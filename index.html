
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIYAN GAMING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b16;color:white;font-family:Arial}
header{text-align:center;padding:25px 10px;background:#111a30;border-bottom:2px solid #00e5ff}
h1{color:#00e5ff;margin:0;letter-spacing:2px}
header p{color:#aab8d0}
main{max-width:1100px;margin:auto;padding:16px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #344568;background:#121a30;color:white;margin:10px 0 18px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.card{background:#121a30;border:1px solid #293b5e;border-radius:13px;padding:15px;text-align:center}
.card .emoji{font-size:35px}
.card h3{font-size:15px;min-height:32px}
button{background:#00d9ef;color:#00121b;border:0;border-radius:8px;padding:11px 15px;font-weight:bold;margin:4px;cursor:pointer}
.card button{width:100%}
#game{display:none;background:#121a30;border:1px solid #00d9ef;border-radius:14px;padding:18px;margin-top:20px;text-align:center}
#area{min-height:150px;padding:12px}
#msg{color:#ffe082;min-height:25px}
.big{font-size:35px;margin:12px}
footer{text-align:center;color:#71809e;padding:25px}
</style>
</head>
<body>
<header>
<h1>ZIYAN GAMING</h1>
<p>25 Mini Games • Play For Fun</p>
</header>
<main>
<h2>🎮 ALL GAMES (25)</h2>
<input id="search" placeholder="Search games..." oninput="render()">
<div class="games" id="games"></div>
<div id="game">
<h2 id="title"></h2>
<div id="msg"></div>
<div id="area"></div>
<button onclick="start(current)">Restart</button>
<button onclick="back()">Back to Games</button>
</div>
</main>
<footer>© 2026 ZIYAN GAMING</footer>
<script>
const list=[
["🐍","Snake"],["⚡","Tap Rush"],["⏱️","Reaction Test"],
["🔢","Number Guess"],["➗","Math Master"],["🧠","Memory Match"],
["⭕","Tic Tac Toe"],["✊","Rock Paper Scissors"],["🪙","Coin Flip"],
["🎲","Dice Duel"],["🔨","Whack a Mole"],["🎨","Color Match"],
["🍊","Odd One Out"],["📈","Higher or Lower"],["⌨️","Typing Test"],
["🔤","Word Scramble"],["🧩","Sequence Memory"],["🧱","Dodge Blocks"],
["🏓","Pong"],["🧱","Brick Breaker"],["⭐","Catch Stars"],
["🔲","2048"],["💡","Lights Out"],["🔍","Quick Count"],
["🎯","Target Practice"]
];
let current=0,timer=null,score=0,secret=0,sequence=[],step=0,turn=0,board=[];
const $=id=>document.getElementById(id);
function render(){
 $("games").innerHTML="";
 list.forEach((g,i)=>{
 if(!g[1].toLowerCase().includes($("search").value.toLowerCase()))return;
 $("games").innerHTML+=`<div class="card"><div class="emoji">${g[0]}</div><h3>${i+1}. ${g[1]}</h3><button onclick="start(${i})">PLAY NOW</button></div>`;
 });
}
function say(s){$("msg").textContent=s}
function area(s){$("area").innerHTML=s}
function button(s,fn){return `<button onclick="${fn}">${s}</button>`}
function start(i){
 clearInterval(timer);current=i;score=0;
 $("game").style.display="block";
 $("title").textContent=list[i][1];
 say("");area("");
 $("game").scrollIntoView({behavior:"smooth"});
 const games=[snake,tap,reaction,guess,math,memory,tictactoe,rps,coin,dice,mole,color,odd,higher,typing,scramble,sequenceGame,dodge,pong,brick,catchStar,game2048,lights,quick,target];
 games[i]();
}
function back(){clearInterval(timer);$("game").style.display="none"}
function result(s){say(s)}
function tap(){
 let n=0;
 area(`<div class="big" id="count">0</div>${button("TAP!","tapPoint()")}`);
 window.tapPoint=()=>{$("count").textContent=++n;if(n>=20)say("You win! 20 taps completed!")}
}
function reaction(){
 area(button("WAIT...",""));
 say("Wait for the green button!");
 let done=false;
 timer=setTimeout(()=>{if(!done){area(button("TAP NOW!","reactTap()"));say("GO! GO! GO!")}},1800);
 window.reactTap=()=>{done=true;clearTimeout(timer);say("Great reaction! You scored!")}
}
function guess(){
 secret=1+Math.floor(Math.random()*20);
 area(`<p>Guess a number between 1 and 20</p><input id="answer" type="number"><button onclick="checkGuess()">CHECK</button>`);
 window.checkGuess=()=>{let n=+$("answer").value;say(n===secret?"Correct! You win!":n<secret?"Too low! Try again.":"Too high! Try again.")};
}
function math(){
 let a=2+Math.floor(Math.random()*20),b=2+Math.floor(Math.random()*20),ans=a+b;
 area(`<h2>${a} + ${b} = ?</h2><input id="answer" type="number"><button onclick="say(+$('answer').value===${ans}?'Correct!':'Try again!')">CHECK</button>`);
}
function memory(){
 let a=["🍎","🍌","🍇","🍒","🍉","🥝"].sort(()=>Math.random()-.5).slice(0,3);
 let all=[...a,...a].sort(()=>Math.random()-.5);
 area(all.map((x,i)=>button("❔","flip("+i+")")).join(""));
 window.flip=i=>{let b=$("area").children[i];if(b.textContent!=="❔")return;b.textContent=all[i];if([...$("area").children].every(x=>x.textContent!=="❔"))say("Great! You found all pairs!")};
}
function rps(){
 area(["Rock","Paper","Scissors"].map(x=>button(x,`playRPS('${x}')`)).join(""));
 window.playRPS=x=>{let y=["Rock","Paper","Scissors"][Math.floor(Math.random()*3)];say("You: "+x+" | Computer: "+y+" — "+(x===y?"Draw!":({Rock:"Scissors",Paper:"Rock",Scissors:"Paper"}[x]===y?"You win!":"Computer wins!")))}
}
function coin(){
 area(button("FLIP COIN","flipCoin()"));
 window.flipCoin=()=>say(Math.random()<.5?"HEADS!":"TAILS!");
}
function dice(){
 area(button("ROLL DICE","rollDice()"));
 window.rollDice=()=>say("You rolled: "+(1+Math.floor(Math.random()*6)));
}
function color(){
 let c=["red","blue","green","orange","purple"],v=c[Math.floor(Math.random()*5)];
 area(`<h2 style="color:${v}">${v.toUpperCase()}</h2>`+c.map(x=>button(x,`say('${x===v?"Correct!":"Wrong! Try again."}')`)).join(""));
}
function odd(){
 let a=["🍎","🍎","🍎","🍊"];
 a.sort(()=>Math.random()-.5);
 area(a.map((x,i)=>button(x,`say('${x==="🍊"?"Correct!":"Wrong one!"}')`)).join(""));
}
function higher(){
 let n=1+Math.floor(Math.random()*10);
 area(`<h2>Number: ${n}</h2>${button("Higher","higherPick(1)")} ${button("Lower","higherPick(0)")}`);
 window.higherPick=x=>{let m=1+Math.floor(Math.random()*10);say("Next number: "+m+" — "+((x?m>n:m<n)?"Correct!":"Wrong!"))};
}
function typing(){
 let words=["gaming","computer","javascript","ziyan","football"];
 let w=words[Math.floor(Math.random()*words.length)];
 area(`<h2>${w}</h2><input id="answer" placeholder="Type the word"><button onclick="say($('answer').value==='${w}'?'Correct!':'Try again!')">CHECK</button>`);
}
function scramble(){
 let w=["apple","planet","gaming","orange","school"][Math.floor(Math.random()*5)];
 let s=w.split("").sort(()=>Math.random()-.5).join("");
 area(`<h2>${s}</h2><input id="answer"><button onclick="say($('answer').value.toLowerCase()==='${w}'?'Correct!':'Try again!')">CHECK</button>`);
}
function sequenceGame(){
 sequence=Array.from({length:4},()=>Math.floor(Math.random()*4)+1);step=0;
 area("<h2>Remember this sequence:</h2><div class='big'>"+sequence.join(" - ")+"</div><button onclick='showSequenceInput()'>READY</button>");
 window.showSequenceInput=()=>area(`<input id="answer" placeholder="Enter sequence e.g. 1234"><button onclick="say($('answer').value=== '${sequence.join("")}'?'Amazing! Correct sequence!':'Not quite! Try again.')">SUBMIT</button>`);
}
function tictactoe(){
 board=Array(9).fill("");turn=0;drawTTT();
}
function drawTTT(){
 area(board.map((v,i)=>button(v||" ",`tt(${i})`)).join(""));
 window.tt=i=>{if(board[i]||winner())return;board[i]="X";if(!winner()){let e=board.map((v,j)=>v?null:j).filter(v=>v!==null);if(e.length)board[e[Math.floor(Math.random()*e.length)]]="O"}drawTTT();if(winner())say(winner()+" wins!");else if(board.every(Boolean))say("Draw!")};
}
function winner(){
 for(let a of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(board[a[0]]&&board[a[0]]===board[a[1]]&&board[a[1]]===board[a[2]])return board[a[0]];
 return "";
}
function mole(){
 let n=0;
 area(`<div class="big" id="mole">🐹</div><button onclick="hitMole()">HIT!</button>`);
 window.hitMole=()=>{say("Hit! Score: "+(++n));$("mole").textContent=["🐹","🐰","🐸"][Math.floor(Math.random()*3)]};
}
function quick(){
 let n=Math.floor(Math.random()*8)+2;
 area(`<h2>${"⭐".repeat(n)}</h2><input id="answer" type="number" placeholder="How many?"><button onclick="say(+$('answer').value===${n}?'Correct!':'Try again!')">CHECK</button>`);
}
function target(){
 let n=Math.floor(Math.random()*9)+1;
 area(`<h2 class="big">🎯 ${n}</h2><input id="answer" type="number" placeholder="Enter target number"><button onclick="say(+$('answer').value===${n}?'Bullseye!':'Missed!')">SHOOT</button>`);
}
function lights(){
 let n=0;
 area(`<div class="big" id="light">💡</div><button onclick="n++;$('light').textContent=n%2?'🌑':'💡';say(n%2?'Light off!':'Light on!')">SWITCH</button>`);
}
function game2048(){
 let n=2;
 area(`<div class="big" id="num">2</div><button onclick="n*=2;$('num').textContent=n;say(n>=2048?'You reached 2048!':'Keep going!')">MERGE TILES</button>`);
}
function snake(){
 let n=0;
 area(`<div class="big">🐍</div><p>Collect points by pressing the button!</p><button onclick="say('Score: '+(++n))">EAT FOOD</button>`);
}
function dodge(){
 let n=0;
 area(`<div class="big">🧱</div><p>Avoid the falling blocks!</p><button onclick="say('You dodged! Score: '+(++n))">DODGE</button>`);
}
function pong(){
 let n=0;
 area(`<div class="big">🏓</div><p>Keep the ball in play!</p><button onclick="say('Bounce! Score: '+(++n))">BOUNCE BALL</button>`);
}
function brick(){
 let n=10;
 area(`<div class="big">🧱 🧱 🧱</div><button onclick="n--;say(n>0?'Bricks left: '+n:'All bricks broken! You win!')">HIT BRICKS</button>`);
}
function catchStar(){
 let n=0;
 area(`<div class="big">⭐</div><button onclick="say('Stars caught: '+(++n))">CATCH STAR</button>`);
}
render();
</script>
</body>
</html>
