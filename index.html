function snake(){
 gameBox("Snake Game",`
 <p>Score: <span id="snakeScore">0</span></p>
 <canvas id="snakeCanvas" width="300" height="300" style="background:#080b16;max-width:100%"></canvas>
 <p><button onclick="snakeDir(0,-1)">UP</button></p>
 <button onclick="snakeDir(-1,0)">LEFT</button>
 <button onclick="snakeDir(1,0)">RIGHT</button>
 <p><button onclick="snakeDir(0,1)">DOWN</button></p>`);
 let c=document.getElementById("snakeCanvas"),ctx=c.getContext("2d");
 let body=[{x:7,y:7}],food={x:3,y:5},dx=1,dy=0,score=0,dead=false;
 window.snakeDir=(x,y)=>{if(x!==-dx||y!==-dy){dx=x;dy=y}};
 window.snakeTimer=setInterval(()=>{
  if(dead)return;
  let h={x:body[0].x+dx,y:body[0].y+dy};
  if(h.x<0||h.y<0||h.x>=15||h.y>=15||body.some(p=>p.x===h.x&&p.y===h.y)){
   dead=true;clearInterval(window.snakeTimer);alert("Game over! Score: "+score);return;
  }
  body.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)};document.getElementById("snakeScore").textContent=score}
  else body.pop();
  ctx.fillStyle="#080b16";ctx.fillRect(0,0,300,300);
  ctx.fillStyle="#00e5ff";body.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18));
  ctx.fillStyle="red";ctx.fillRect(food.x*20,food.y*20,18,18);
 },150);
}

function ttt(){
 let b=Array(9).fill(""),turn="X";
 gameBox("Tic Tac Toe",`<h3 id="tttStatus">Turn: X</h3><div style="display:grid;grid-template-columns:repeat(3,75px);gap:5px;justify-content:center">${b.map((v,i)=>`<button id="ttt${i}" style="height:70px;font-size:25px" onclick="tttPlay(${i})"></button>`).join("")}</div><button onclick="ttt()">RESTART</button>`);
 window.tttPlay=i=>{
  if(b[i]||!turn)return;b[i]=turn;document.getElementById("ttt"+i).textContent=turn;
  let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  if(wins.some(w=>w.every(j=>b[j]===turn))){document.getElementById("tttStatus").textContent=turn+" wins!";turn="";return}
  if(b.every(Boolean)){document.getElementById("tttStatus").textContent="Draw!";turn="";return}
  turn=turn==="X"?"O":"X";document.getElementById("tttStatus").textContent="Turn: "+turn;
 };
}

function pong(){
 gameBox("Pong Mini",`<canvas id="pongCanvas" width="300" height="220" style="background:#10182c;max-width:100%"></canvas><p><button onclick="pongMove(-1)">LEFT</button><button onclick="pongMove(1)">RIGHT</button></p><p id="pongScore">Score: 0</p>`);
 let c=document.getElementById("pongCanvas"),ctx=c.getContext("2d"),x=125,bx=100,by=80,vx=3,vy=3,score=0,over=false;
 window.pongMove=d=>x=Math.max(0,Math.min(250,x+d*20));
 window.pongTimer=setInterval(()=>{
  if(over)return;bx+=vx;by+=vy;if(bx<5||bx>295)vx=-vx;if(by<5)vy=-vy;
  if(by>195&&bx>x&&bx<x+50){vy=-Math.abs(vy);score++;document.getElementById("pongScore").textContent="Score: "+score}
  if(by>220){over=true;clearInterval(window.pongTimer);alert("Game over!")}
  ctx.clearRect(0,0,300,220);ctx.fillStyle="white";ctx.fillRect(x,205,50,8);ctx.beginPath();ctx.arc(bx,by,7,0,7);ctx.fill();
 },30);
}

function brick(){
 gameBox("Brick Breaker",`<canvas id="brickCanvas" width="300" height="300" style="background:#10182c;max-width:100%"></canvas><p><button onclick="brickMove(-1)">LEFT</button><button onclick="brickMove(1)">RIGHT</button></p><p id="brickScore">Score: 0</p>`);
 let c=document.getElementById("brickCanvas"),ctx=c.getContext("2d"),x=120,bx=150,by=220,vx=3,vy=-3,score=0,bricks=Array.from({length:15},(_,i)=>({x:(i%5)*58+5,y:Math.floor(i/5)*25+20,on:true})),over=false;
 window.brickMove=d=>x=Math.max(0,Math.min(250,x+d*20));
 window.brickTimer=setInterval(()=>{
  if(over)return;bx+=vx;by+=vy;if(bx<5||bx>295)vx=-vx;if(by<5)vy=-vy;
  if(by>270&&bx>x&&bx<x+50)vy=-Math.abs(vy);
  bricks.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+50&&by>b.y&&by<b.y+18){b.on=false;vy=-vy;score++;document.getElementById("brickScore").textContent="Score: "+score}});
  if(by>300||bricks.every(b=>!b.on)){over=true;clearInterval(window.brickTimer);alert("Finished! Score: "+score)}
  ctx.clearRect(0,0,300,300);ctx.fillStyle="white";ctx.fillRect(x,280,50,8);ctx.beginPath();ctx.arc(bx,by,6,0,7);ctx.fill();ctx.fillStyle="#00e5ff";bricks.forEach(b=>{if(b.on)ctx.fillRect(b.x,b.y,50,18)});
 },30);
}

function g2048(){
 let b=Array(16).fill(0);b[5]=2;
 gameBox("2048 Mini",`<div id="board2048" style="display:grid;grid-template-columns:repeat(4,55px);gap:5px;justify-content:center"></div><p><button onclick="move2048('left')">LEFT</button><button onclick="move2048('right')">RIGHT</button><button onclick="move2048('up')">UP</button><button onclick="move2048('down')">DOWN</button></p>`);
 function draw(){document.getElementById("board2048").innerHTML=b.map(v=>`<div style="height:55px;background:#26334d;display:grid;place-items:center;font-size:20px">${v||""}</div>`).join("")}
 window.move2048=dir=>{
  for(let r=0;r<4;r++){
   let ids=dir==="left"||dir==="right"?Array.from({length:4},(_,i)=>r*4+(dir==="left"?i:3-i)):Array.from({length:4},(_,i)=>(dir==="up"?i:3-i)*4+r);
   let vals=ids.map(i=>b[i]).filter(Boolean);
   for(let i=0;i<vals.length-1;i++){if(vals[i]===vals[i+1]){vals[i]*=2;vals.splice(i+1,1)}}
   while(vals.length<4)vals.push(0);ids.forEach((id,i)=>b[id]=vals[i]);
  }
  let e=b.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(e.length)b[e[Math.floor(Math.random()*e.length)]]=2;draw();
 };
 draw();
}

function start3d(i){
 const gameName=games3[i]||"3D Runner";

 gameBox(gameName,`
  <h3>${gameName}</h3>
  <p>3D-style endless runner</p>
  <canvas id="world3d" width="340" height="420"
    style="width:100%;max-width:340px;background:#101a35;border:2px solid #00e5ff;border-radius:10px">
  </canvas>
  <h3>Score: <span id="worldScore">0</span></h3>
  <p>
   <button onclick="worldMove(-1)">LEFT</button>
   <button onclick="worldMove(1)">RIGHT</button>
   <button onclick="worldJump()">JUMP</button>
  </p>
  <p>Use buttons to avoid the red blocks.</p>
 `);

 const canvas=document.getElementById("world3d");
 const ctx=canvas.getContext("2d");

 let lane=1;
 let obstacles=[];
 let score=0;
 let jump=0;
 let finished=false;
 let frame=0;

 window.worldMove=(direction)=>{
  lane=Math.max(0,Math.min(2,lane+direction));
 };

 window.worldJump=()=>{
  if(jump===0)jump=90;
 };

 function drawRoad(){
  ctx.fillStyle="#101a35";
  ctx.fillRect(0,0,340,420);

  ctx.fillStyle="#354567";
  ctx.beginPath();
  ctx.moveTo(105,0);
  ctx.lineTo(235,0);
  ctx.lineTo(340,420);
  ctx.lineTo(0,420);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=2;
  ctx.setLineDash([15,15]);

  ctx.beginPath();
  ctx.moveTo(150,0);
  ctx.lineTo(115,420);
  ctx.moveTo(190,0);
  ctx.lineTo(225,420);
  ctx.stroke();

  ctx.setLineDash([]);
 }

 function drawPlayer(){
  let x=170+(lane-1)*70;
  let y=355-jump;

  ctx.fillStyle="#00e5ff";
  ctx.fillRect(x-15,y,30,42);

  ctx.fillStyle="#ffffff";
  ctx.fillRect(x-8,y+8,6,6);
  ctx.fillRect(x+3,y+8,6,6);
 }

 function drawObstacles(){
  obstacles.forEach(o=>{
   let depth=o.depth;
   let size=12+depth*.17;
   let y=depth;
   let x=170+(o.lane-1)*(10+depth*.17);

   ctx.fillStyle="#ff4141";
   ctx.fillRect(x-size/2,y,size,size);

   if(y>340&&y<405&&o.lane===lane&&jump<35){
    finished=true;
    clearInterval(window.worldTimer);
    alert("Game Over! Score: "+Math.floor(score/10));
   }
  });
 }

 function update(){
  if(finished)return;

  frame++;

  drawRoad();

  if(frame%45===0){
   obstacles.push({
    lane:Math.floor(Math.random()*3),
    depth:0
   });
  }

  obstacles.forEach(o=>o.depth+=3);
  obstacles=obstacles.filter(o=>o.depth<430);

  drawObstacles();
  drawPlayer();

  if(jump>0)jump-=6;

  score++;
  document.getElementById("worldScore").textContent=Math.floor(score/10);
 }

 clearInterval(window.worldTimer);
 window.worldTimer=setInterval(update,40);
}

// ===== STOP RUNNING GAMES WHEN EXITING =====

const originalBack=back;

back=function(){
 clearInterval(window.snakeTimer);
 clearInterval(window.dodgeTimer);
 clearInterval(window.pongTimer);
 clearInterval(window.brickTimer);
 clearInterval(window.worldTimer);
 clearTimeout(window.reactTimer);

 originalBack();
};

// ===== FINAL INITIALIZATION =====

render();

// ===== END OF ZIYAN GAMING CODE =====
 

 
</script>
