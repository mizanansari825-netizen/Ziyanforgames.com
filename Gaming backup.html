
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIYAN GAMING</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101820;
 color:#f4f1e9;
 font-family:Georgia,serif;
}
header{
 text-align:center;
 padding:25px 15px;
 background:#0b1218;
 border-bottom:1px solid #e6b85c;
}
header h1{
 margin:0;
 color:#e6b85c;
 letter-spacing:4px;
 font-size:32px;
}
header p{
 color:#a9b5bd;
 font:13px Arial;
}
main{
 max-width:1100px;
 margin:auto;
 padding:20px 14px;
}
.tabs{
 display:flex;
 gap:10px;
 margin-bottom:22px;
}
.tab{
 flex:1;
 padding:13px;
 border:1px solid #e6b85c;
 background:transparent;
 color:#e6b85c;
 border-radius:7px;
 font-weight:bold;
}
.tab.active{
 background:#e6b85c;
 color:#17212a;
}
#games{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:13px;
}
.card{
 background:linear-gradient(145deg,#22333e,#17232c);
 border:1px solid #31424d;
 border-radius:10px;
 padding:15px;
 min-height:145px;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
}
.card .num{
 color:#e6b85c;
 font:12px Arial;
}
.card h3{
 font-size:17px;
 margin:12px 0;
}
.play{
 border:0;
 border-radius:6px;
 background:#e6b85c;
 color:#17212a;
 padding:10px;
 font-weight:bold;
}
#screen{
 display:none;
 background:#17232c;
 border:1px solid #e6b85c;
 border-radius:12px;
 padding:16px;
 min-height:400px;
}
.gamehead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 border-bottom:1px solid #31424d;
 padding-bottom:12px;
 margin-bottom:18px;
}
.gamehead h2{
 margin:0;
 color:#e6b85c;
 font-size:22px;
}
.back{
 background:transparent;
 color:#e6b85c;
 border:1px solid #e6b85c;
 border-radius:6px;
 padding:9px 13px;
}
#stage{
 text-align:center;
 max-width:650px;
 margin:auto;
 font-family:Arial,sans-serif;
}
#stage button{
 background:#e6b85c;
 color:#17212a;
 border:0;
 border-radius:6px;
 padding:11px 15px;
 margin:5px;
 font-weight:bold;
}
#stage input{
 padding:11px;
 border-radius:6px;
 border:1px solid #e6b85c;
 background:#0d171e;
 color:white;
 width:min(220px,90%);
}
#stage .big{
 font-size:38px;
 color:#e6b85c;
 margin:18px;
}
#stage .board{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 max-width:300px;
 margin:18px auto;
}
#stage .cell{
 height:85px;
 font-size:30px;
 background:#263945;
 color:white;
 border:1px solid #53636d;
 border-radius:8px;
}
#stage canvas{
 display:block;
 max-width:100%;
 margin:12px auto;
 background:#09131a;
 border:1px solid #53636d;
 border-radius:8px;
 touch-action:manipulation;
}
footer{
 text-align:center;
 color:#71818b;
 padding:25px;
 font:12px Arial;
}
@media(max-width:420px){
 #games{grid-template-columns:repeat(2,minmax(0,1fr))}
 .card{padding:12px;min-height:135px}
}
</style>
</head>

<body>

<header>
<h1>ZIYAN GAMING</h1>
<p>CLASSIC ARCADE • QUICK PLAY • HAVE FUN</p>
</header>

<main>

<div id="home">
 <div class="tabs">
  <button class="tab active" id="allTab"
  onclick="showGames('all')">ALL GAMES</button>

  <button class="tab" id="favTab"
  onclick="showGames('puzzle')">PUZZLE & BRAIN</button>
 </div>

 <div id="games"></div>
</div>

<section id="screen">
 <div class="gamehead">
  <h2 id="gameTitle">Game</h2>
  <button class="back" onclick="goHome()">
  ← BACK TO GAMES
  </button>
 </div>
 <div id="stage"></div>
</section>

</main>

<footer>ZIYAN GAMING · 25 CLASSIC MINI GAMES</footer>

<script>

const names=[
'Tic Tac Toe',
'Rock Paper Scissors',
'Guess The Number',
'Tap Counter',
'Reaction Test',
'Memory Match',
'Math Sprint',
'Word Scramble',
'Color Match',
'Higher or Lower',
'Dice Duel',
'Coin Flip',
'Number Sequence',
'Odd One Out',
'Whack The Dot',
'Snake',
'Pong',
'Breakout',
'Catch The Stars',
'Dodge Blocks',
'2048 Mini',
'Lights Out',
'Typing Sprint',
'Quick Quiz',
'Target Click'
];

const puzzle=new Set([
0,2,5,6,7,8,9,12,13,20,21,22,23
]);

let currentTimer=null;
let cleanup=null;
let active=0;

function showGames(mode='all'){

 document.getElementById('home').style.display='block';
 document.getElementById('screen').style.display='none';

 document.getElementById('allTab').classList.toggle(
 'active',mode==='all');

 document.getElementById('favTab').classList.toggle(
 'active',mode==='puzzle');

 document.getElementById('games').innerHTML=
 names.map((n,i)=>({n,i}))
 .filter(x=>mode==='all'||puzzle.has(x.i))
 .map(x=>`
 <article class="card">
  <span class="num">GAME ${String(x.i+1).padStart(2,'0')}</span>
  <h3>${x.n}</h3>
  <button class="play" onclick="openGame(${x.i})">
  PLAY NOW →
  </button>
 </article>
 `).join('');
}

function goHome(){
 if(currentTimer)clearInterval(currentTimer);
 if(cleanup)cleanup();

 currentTimer=null;
 cleanup=null;

 showGames('all');
}

function openGame(i){
 active=i;

 if(currentTimer)clearInterval(currentTimer);
 if(cleanup)cleanup();

 currentTimer=null;
 cleanup=null;

 document.getElementById('home').style.display='none';
 document.getElementById('screen').style.display='block';

 document.getElementById('gameTitle').textContent=names[i];

 const s=document.getElementById('stage');
 s.innerHTML='';

 games[i](s);
}

function msg(s,t){
 s.innerHTML=`<p>${t}</p>`;
}

function btn(s,t,fn){
 let b=document.createElement('button');
 b.textContent=t;
 b.onclick=fn;
 s.appendChild(b);
 return b;
}

function ticTacToe(s){
 let board=Array(9).fill('');
 let turn='X';
 s.innerHTML='<h3>Play against a friend</h3><div class="board" id="ttt"></div><p id="status">Player X turn</p>';
 const grid=s.querySelector('#ttt');
 board.forEach((_,i)=>{
  let b=document.createElement('button');
  b.className='cell';
  b.onclick=()=>{
   if(board[i]||!turn)return;
   board[i]=turn;
   b.textContent=turn;
   let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
   let win=wins.some(w=>w.every(x=>board[x]===turn));
   if(win){
    s.querySelector('#status').textContent='Player '+turn+' wins!';
    turn='';
   }else if(board.every(Boolean)){
    s.querySelector('#status').textContent='Draw!';
    turn='';
   }else{
    turn=turn==='X'?'O':'X';
    s.querySelector('#status').textContent='Player '+turn+' turn';
   }
  };
  grid.appendChild(b);
 });
 btn(s,'Restart',()=>ticTacToe(s));
}

function rockPaperScissors(s){
 let score=0;
 const choices=['Rock','Paper','Scissors'];
 s.innerHTML='<h3>Choose your move</h3><p id="result">First to play wins!</p><h2 id="score">Score: 0</h2>';
 choices.forEach(c=>btn(s,c,()=>{
  let cpu=choices[Math.floor(Math.random()*3)];
  let result=c===cpu?'Draw':(
   (c==='Rock'&&cpu==='Scissors')||
   (c==='Paper'&&cpu==='Rock')||
   (c==='Scissors'&&cpu==='Paper')?'You win!':'Computer wins!');
  if(result==='You win!')score++;
  s.querySelector('#result').textContent='You: '+c+' | Computer: '+cpu+' — '+result;
  s.querySelector('#score').textContent='Score: '+score;
 }));
}

function guessNumber(s){
 let answer=Math.floor(Math.random()*100)+1;
 let tries=0;
 s.innerHTML='<h3>Guess a number from 1 to 100</h3><input id="guess" type="number" min="1" max="100" placeholder="Enter number"><p id="hint">You have unlimited tries!</p>';
 btn(s,'CHECK',()=>{
  let n=Number(s.querySelector('#guess').value);
  if(!Number.isInteger(n)||n<1||n>100){
   s.querySelector('#hint').textContent='Enter a number from 1 to 100.';
   return;
  }
  tries++;
  let hint=n===answer?'Correct! You won in '+tries+' tries!':n<answer?'Too low! Try higher.':'Too high! Try lower.';
  s.querySelector('#hint').textContent=hint;
 });
 btn(s,'New Number',()=>guessNumber(s));
}

function tapCounter(s){
 let count=0,time=10;
 s.innerHTML='<h3>Tap as fast as you can!</h3><div class="big" id="count">0</div><p id="time">Time: 10</p>';
 let play=btn(s,'TAP!',()=>{
  if(time<=0)return;
  count++;
  s.querySelector('#count').textContent=count;
 });
 currentTimer=setInterval(()=>{
  time--;
  s.querySelector('#time').textContent='Time: '+time;
  if(time<=0){
   clearInterval(currentTimer);
   currentTimer=null;
   play.disabled=true;
   msg(s,'Time up! Your score: '+count);
   btn(s,'Play Again',()=>tapCounter(s));
  }
 },1000);
}

function reactionTest(s){
 s.innerHTML='<h3>Reaction Test</h3><p id="info">Press START, then wait for green.</p><div class="big" id="area">READY?</div>';
 let area=s.querySelector('#area');
 let waiting=false,started=false,start=0,timer=null;
 const startBtn=btn(s,'START',()=>{
  if(started)return;
  started=true;
  waiting=true;
  area.textContent='WAIT...';
  startBtn.disabled=true;
  timer=setTimeout(()=>{
   waiting=false;
   start=Date.now();
   area.textContent='TAP NOW!';
   area.style.color='#55dd88';
  },1500+Math.random()*3000);
 });
 area.onclick=()=>{
  if(waiting){
   clearTimeout(timer);
   area.textContent='Too early!';
   s.querySelector('#info').textContent='Try again.';
   started=false;
   startBtn.disabled=false;
  }else if(start){
   s.querySelector('#info').textContent='Your reaction: '+(Date.now()-start)+' ms';
   start=0;
   started=false;
   startBtn.disabled=false;
   area.textContent='DONE';
   area.style.color='#e6b85c';
  }
 };
 cleanup=()=>clearTimeout(timer);
}

function memoryMatch(s){
 let symbols=['★','●','▲','◆','♥','■','★','●','▲','◆','♥','■'];
 symbols.sort(()=>Math.random()-.5);
 let first=null,lock=false,moves=0,matched=0;
 s.innerHTML='<h3>Find matching pairs</h3><p id="moves">Moves: 0</p><div class="board" id="memory"></div>';
 let grid=s.querySelector('#memory');
 grid.style.gridTemplateColumns='repeat(4,1fr)';
 symbols.forEach((v,i)=>{
  let b=document.createElement('button');
  b.className='cell';
  b.textContent='?';
  b.onclick=()=>{
   if(lock||b.dataset.done||b===first)return;
   b.textContent=v;
   if(!first){first=b;return;}
   moves++;
   s.querySelector('#moves').textContent='Moves: '+moves;
   if(first.textContent===b.textContent){
    first.dataset.done='1';b.dataset.done='1';
    first=null;matched+=2;
    if(matched===12)msg(s,'You matched all pairs in '+moves+' moves!');
   }else{
    lock=true;
    let old=first;
    currentTimer=setTimeout(()=>{
     old.textContent='?';b.textContent='?';
     first=null;lock=false;currentTimer=null;
    },700);
   }
  };
  grid.appendChild(b);
 });
 btn(s,'Restart',()=>memoryMatch(s));
}

function mathSprint(s){
 let score=0,time=30;
 s.innerHTML='<h3>Solve as many as you can!</h3><div class="big" id="question"></div><input id="answer" type="number" placeholder="Your answer"><p id="score">Score: 0</p><p id="time">Time: 30</p>';
 let a,b,correct;
 function question(){
  a=Math.floor(Math.random()*12)+1;
  b=Math.floor(Math.random()*12)+1;
  correct=a+b;
  s.querySelector('#question').textContent=a+' + '+b+' = ?';
  s.querySelector('#answer').value='';
 }
 btn(s,'SUBMIT',()=>{
  if(time<=0)return;
  if(Number(s.querySelector('#answer').value)===correct){
   score++;
   s.querySelector('#score').textContent='Score: '+score;
  }
  question();
 });
 question();
 currentTimer=setInterval(()=>{
  time--;
  s.querySelector('#time').textContent='Time: '+time;
  if(time<=0){
   clearInterval(currentTimer);
   currentTimer=null;
   msg(s,'Time up! Your score: '+score);
   btn(s,'Play Again',()=>mathSprint(s));
  }
 },1000);
}

function wordScramble(s){
 const words=['GAMING','COMPUTER','PLANET','PUZZLE','ROCKET','MONSTER','ARCADE','PLAYER'];
 let word=words[Math.floor(Math.random()*words.length)];
 let mixed=word.split('').sort(()=>Math.random()-.5).join('');
 s.innerHTML='<h3>Unscramble the word</h3><div class="big">'+mixed+'</div><input id="word" placeholder="Your answer"><p id="hint">Unscramble the letters!</p>';
 btn(s,'CHECK',()=>{
  let val=s.querySelector('#word').value.trim().toUpperCase();
  s.querySelector('#hint').textContent=val===word?'Correct! You got it!':'Not quite. Try again!';
 });
 btn(s,'New Word',()=>wordScramble(s));
 }
 
function colorMatch(s){
 const colors=['RED','BLUE','GREEN','YELLOW','PURPLE'];
 let score=0,time=20;
 s.innerHTML='<h3>Match the color name!</h3><div class="big" id="word"></div><p id="time">Time: 20</p><p id="score">Score: 0</p>';
 function next(){
  let c=colors[Math.floor(Math.random()*colors.length)];
  let display=colors[Math.floor(Math.random()*colors.length)];
  s.querySelector('#word').textContent=display;
  s.querySelector('#word').style.color=c.toLowerCase();
  s.querySelector('#word').dataset.correct=display===c?'YES':'NO';
 }
 colors.forEach(c=>btn(s,c,()=>{
  if(time<=0)return;
  if(s.querySelector('#word').dataset.correct==='YES'&&c===s.querySelector('#word').textContent)score++;
  s.querySelector('#score').textContent='Score: '+score;
  next();
 }));
 next();
 currentTimer=setInterval(()=>{
  time--;
  s.querySelector('#time').textContent='Time: '+time;
  if(time<=0){
   clearInterval(currentTimer);currentTimer=null;
   msg(s,'Time up! Score: '+score);
   btn(s,'Play Again',()=>colorMatch(s));
  }
 },1000);
}

function higherLower(s){
 let current=Math.floor(Math.random()*13)+1,score=0;
 s.innerHTML='<h3>Will the next number be higher or lower?</h3><div class="big" id="num">'+current+'</div><p id="score">Score: 0</p>';
 function play(choice){
  let next=Math.floor(Math.random()*13)+1;
  let correct=choice==='higher'?next>current:next<current;
  if(next===current)correct=false;
  if(correct)score++;else score=0;
  current=next;
  s.querySelector('#num').textContent=current;
  s.querySelector('#score').textContent='Score: '+score;
  s.querySelector('#result').textContent=correct?'Correct!':'Wrong! Streak reset.';
 }
 s.innerHTML+='<p id="result">Choose carefully!</p>';
 btn(s,'HIGHER',()=>play('higher'));
 btn(s,'LOWER',()=>play('lower'));
}

function diceDuel(s){
 s.innerHTML='<h3>Dice Duel</h3><div class="big" id="dice">⚄</div><p id="result">Roll the dice!</p>';
 btn(s,'ROLL DICE',()=>{
  let a=Math.floor(Math.random()*6)+1;
  let b=Math.floor(Math.random()*6)+1;
  s.querySelector('#dice').textContent='You: '+a+' | CPU: '+b;
  s.querySelector('#result').textContent=a>b?'You win!':a<b?'Computer wins!':'Draw!';
 });
}

function coinFlip(s){
 s.innerHTML='<h3>Heads or Tails?</h3><div class="big" id="coin">?</div><p id="result">Make your choice!</p>';
 ['HEADS','TAILS'].forEach(c=>btn(s,c,()=>{
  let result=Math.random()<.5?'HEADS':'TAILS';
  s.querySelector('#coin').textContent=result;
  s.querySelector('#result').textContent=c===result?'You guessed correctly!':'Not this time!';
 }));
}

function numberSequence(s){
 let start=Math.floor(Math.random()*10)+2;
 let step=Math.floor(Math.random()*8)+2;
 let answer=start+step*3;
 s.innerHTML='<h3>Complete the sequence</h3><div class="big">'+[start,start+step,start+step*2,'?'].join(' , ')+'</div><input id="answer" type="number" placeholder="Missing number"><p id="result"></p>';
 btn(s,'CHECK',()=>{
  s.querySelector('#result').textContent=Number(s.querySelector('#answer').value)===answer?'Correct!':'Try again!';
 });
 btn(s,'New Puzzle',()=>numberSequence(s));
}

function oddOneOut(s){
 let groups=[
 ['Apple','Banana','Car','Mango'],
 ['Cat','Dog','Chair','Tiger'],
 ['Red','Blue','Circle','Green'],
 ['Bus','Train','Plane','Potato']
 ];
 let group=groups[Math.floor(Math.random()*groups.length)];
 let answer=group.find(x=>['Car','Chair','Circle','Potato'].includes(x));
 s.innerHTML='<h3>Find the odd one out</h3><p>Choose the item that does not belong.</p>';
 group.sort(()=>Math.random()-.5).forEach(x=>btn(s,x,()=>{
  s.querySelector('#result').textContent=x===answer?'Correct!':'Wrong, try another!';
 }));
 s.innerHTML+='<p id="result"></p>';
}

function whackDot(s){
 let score=0,time=20;
 s.innerHTML='<h3>Tap the moving target!</h3><p id="score">Score: 0</p><p id="time">Time: 20</p><div id="target" style="height:220px;position:relative;background:#263945;border-radius:10px"></div>';
 let area=s.querySelector('#target');
 let dot=document.createElement('button');
 dot.textContent='●';
 dot.style.position='absolute';
 dot.style.margin='0';
 dot.onclick=()=>{
  score++;
  s.querySelector('#score').textContent='Score: '+score;
  move();
 };
 area.appendChild(dot);
 function move(){
  dot.style.left=Math.random()*75+'%';
  dot.style.top=Math.random()*75+'%';
 }
 move();
 currentTimer=setInterval(()=>{
  time--;
  s.querySelector('#time').textContent='Time: '+time;
  if(time<=0){
   clearInterval(currentTimer);currentTimer=null;
   msg(s,'Game over! Score: '+score);
   btn(s,'Play Again',()=>whackDot(s));
  }
 },1000);
}

function snakeGame(s){
 s.innerHTML='<h3>Snake</h3><p>Use arrow keys or buttons.</p><canvas id="snake" width="300" height="300"></canvas><div><button id="up">UP</button><br><button id="left">LEFT</button><button id="down">DOWN</button><button id="right">RIGHT</button></div><p id="score">Score: 0</p>';
 const c=s.querySelector('canvas'),ctx=c.getContext('2d');
 let snake=[{x:150,y:150}],dir={x:10,y:0},food={x:50,y:50},score=0,alive=true;
 function setDir(x,y){
  if(x!==-dir.x||y!==-dir.y)dir={x,y};
 }
 s.querySelector('#up').onclick=()=>setDir(0,-10);
 s.querySelector('#down').onclick=()=>setDir(0,10);
 s.querySelector('#left').onclick=()=>setDir(-10,0);
 s.querySelector('#right').onclick=()=>setDir(10,0);
 function key(e){
  if(e.key==='ArrowUp')setDir(0,-10);
  if(e.key==='ArrowDown')setDir(0,10);
  if(e.key==='ArrowLeft')setDir(-10,0);
  if(e.key==='ArrowRight')setDir(10,0);
 }
 document.addEventListener('keydown',key);
 cleanup=()=>document.removeEventListener('keydown',key);
 currentTimer=setInterval(()=>{
  if(!alive)return;
  let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=300||head.y<0||head.y>=300||snake.some(p=>p.x===head.x&&p.y===head.y)){
   alive=false;
   clearInterval(currentTimer);currentTimer=null;
   s.querySelector('#score').textContent='Game over! Score: '+score;
   btn(s,'Play Again',()=>snakeGame(s));
   return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
   score++;
   food={x:Math.floor(Math.random()*30)*10,y:Math.floor(Math.random()*30)*10};
   s.querySelector('#score').textContent='Score: '+score;
  }else snake.pop();
  ctx.fillStyle='#09131a';ctx.fillRect(0,0,300,300);
  ctx.fillStyle='#e6b85c';snake.forEach(p=>ctx.fillRect(p.x,p.y,9,9));
  ctx.fillStyle='#55dd88';ctx.fillRect(food.x,food.y,9,9);
 },130);
}

function pongGame(s){
 s.innerHTML='<h3>Pong</h3><p>Move your paddle with your finger or mouse.</p><canvas id="pong" width="320" height="240"></canvas><p id="score">Score: 0</p>';
 const c=s.querySelector('canvas'),ctx=c.getContext('2d');
 let x=160,y=100,dx=3,dy=3,paddle=130,score=0;
 function move(e){
  let r=c.getBoundingClientRect();
  paddle=(e.clientX-r.left)*c.width/r.width-35;
 }
 c.addEventListener('pointermove',move);
 cleanup=()=>c.removeEventListener('pointermove',move);
 currentTimer=setInterval(()=>{
  x+=dx;y+=dy;
  if(x<7||x>313)dx=-dx;
  if(y<7)dy=-dy;
  if(y>215&&x>paddle&&x<paddle+70){
   dy=-Math.abs(dy);score++;
   s.querySelector('#score').textContent='Score: '+score;
  }
  if(y>240){
   clearInterval(currentTimer);currentTimer=null;
   msg(s,'Game over! Score: '+score);
   btn(s,'Play Again',()=>pongGame(s));
   return;
  }
  ctx.fillStyle='#09131a';ctx.fillRect(0,0,320,240);
  ctx.fillStyle='#e6b85c';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
  ctx.fillRect(paddle,225,70,8);
 },25);
}

function breakoutGame(s){
 s.innerHTML='<h3>Breakout</h3><p>Move the paddle with your finger or mouse.</p><canvas id="break" width="320" height="260"></canvas><p id="score">Score: 0</p>';
 const c=s.querySelector('canvas'),ctx=c.getContext('2d');
 let x=160,y=200,dx=3,dy=-3,paddle=130,score=0;
 let bricks=Array.from({length:15},(_,i)=>({x:8+(i%5)*62,y:15+Math.floor(i/5)*25,on:true}));
 function move(e){
  let r=c.getBoundingClientRect();
  paddle=(e.clientX-r.left)*c.width/r.width-35;
 }
 c.addEventListener('pointermove',move);
 cleanup=()=>c.removeEventListener('pointermove',move);
 currentTimer=setInterval(()=>{
  x+=dx;y+=dy;
  if(x<6||x>314)dx=-dx;
  if(y<6)dy=-dy;
  if(y>230&&x>paddle&&x<paddle+70)dy=-Math.abs(dy);
  bricks.forEach(b=>{
   if(b.on&&x>b.x&&x<b.x+55&&y>b.y&&y<b.y+15){
    b.on=false;dy=-dy;score++;
    s.querySelector('#score').textContent='Score: '+score;
   }
  });
  if(y>260||score===15){
   clearInterval(currentTimer);currentTimer=null;
   msg(s,score===15?'You cleared all bricks!':'Game over! Score: '+score);
   btn(s,'Play Again',()=>breakoutGame(s));
   return;
  }
  ctx.fillStyle='#09131a';ctx.fillRect(0,0,320,260);
  ctx.fillStyle='#e6b85c';bricks.forEach(b=>{if(b.on)ctx.fillRect(b.x,b.y,55,15)});
  ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();
  ctx.fillRect(paddle,245,70,8);
 },25);
 }
  
function catchStars(s){
 s.innerHTML='<h3>Catch the Stars</h3><p>Move the basket with your finger.</p><canvas id="catch" width="320" height="300"></canvas><p id="score">Score: 0</p>';
 const c=s.querySelector('canvas'),ctx=c.getContext('2d');
 let basket=130,stars=[],score=0,alive=true;
 function move(e){
  let r=c.getBoundingClientRect();
  basket=Math.max(0,Math.min(260,(e.clientX-r.left)*320/r.width-30));
 }
 c.addEventListener('pointermove',move);
 cleanup=()=>c.removeEventListener('pointermove',move);
 currentTimer=setInterval(()=>{
  if(!alive)return;
  if(Math.random()<.06)stars.push({x:Math.random()*300,y:0});
  stars.forEach(a=>a.y+=3);
  stars=stars.filter(a=>{
   if(a.y>265&&a.x>basket-10&&a.x<basket+70){
    score++;
    s.querySelector('#score').textContent='Score: '+score;
    return false;
   }
   if(a.y>300)alive=false;
   return a.y<300;
  });
  ctx.fillStyle='#09131a';ctx.fillRect(0,0,320,300);
  ctx.fillStyle='#e6b85c';
  stars.forEach(a=>{ctx.beginPath();ctx.arc(a.x,a.y,7,0,Math.PI*2);ctx.fill()});
  ctx.fillRect(basket,275,60,12);
  if(!alive){
   clearInterval(currentTimer);currentTimer=null;
   msg(s,'Game over! Stars caught: '+score);
   btn(s,'Play Again',()=>catchStars(s));
  }
 },30);
}

function dodgeBlocks(s){
 s.innerHTML='<h3>Dodge the Blocks</h3><p>Move left and right to avoid blocks.</p><canvas id="dodge" width="320" height="300"></canvas><div><button id="dl">LEFT</button><button id="dr">RIGHT</button></div><p id="score">Score: 0</p>';
 const c=s.querySelector('canvas'),ctx=c.getContext('2d');
 let player=140,blocks=[],score=0,alive=true,left=false,right=false;
 s.querySelector('#dl').onpointerdown=()=>left=true;
 s.querySelector('#dl').onpointerup=()=>left=false;
 s.querySelector('#dr').onpointerdown=()=>right=true;
 s.querySelector('#dr').onpointerup=()=>right=false;
 function key(e){
  if(e.key==='ArrowLeft')left=true;
  if(e.key==='ArrowRight')right=true;
 }
 function keyup(e){
  if(e.key==='ArrowLeft')left=false;
  if(e.key==='ArrowRight')right=false;
 }
 document.addEventListener('keydown',key);
 document.addEventListener('keyup',keyup);
 cleanup=()=>{
  document.removeEventListener('keydown',key);
  document.removeEventListener('keyup',keyup);
 };
 currentTimer=setInterval(()=>{
  if(!alive)return;
  if(left)player-=5;
  if(right)player+=5;
  player=Math.max(0,Math.min(280,player));
  if(Math.random()<.07)blocks.push({x:Math.random()*290,y:0});
  blocks.forEach(b=>b.y+=4);
  blocks=blocks.filter(b=>b.y<300);
  if(blocks.some(b=>b.x<player+40&&b.x+25>player&&b.y<290&&b.y+25>270)){
   alive=false;
   clearInterval(currentTimer);currentTimer=null;
   msg(s,'Game over! Score: '+score);
   btn(s,'Play Again',()=>dodgeBlocks(s));
   return;
  }
  score++;
  s.querySelector('#score').textContent='Score: '+score;
  ctx.fillStyle='#09131a';ctx.fillRect(0,0,320,300);
  ctx.fillStyle='#e6b85c';ctx.fillRect(player,270,40,20);
  ctx.fillStyle='#e35d5d';blocks.forEach(b=>ctx.fillRect(b.x,b.y,25,25));
 },40);
}

function game2048(s){
 let grid=Array(16).fill(0);
 function add(){
  let empty=grid.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
  if(empty.length)grid[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4;
 }
 function draw(){
  s.innerHTML='<h3>2048 Mini</h3><p>Join matching numbers to reach 2048.</p><div id="board" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px;margin:15px auto"></div><p id="status">Use the arrow buttons.</p>';
  let board=s.querySelector('#board');
  grid.forEach(v=>{
   let cell=document.createElement('div');
   cell.style.cssText='height:65px;background:#263945;border-radius:7px;display:grid;place-items:center;font:bold 22px Arial;color:#e6b85c';
   cell.textContent=v||'';
   board.appendChild(cell);
  });
  ['UP','DOWN','LEFT','RIGHT'].forEach(d=>btn(s,d,()=>move(d)));
 }
 function move(dir){
  let old=grid.slice();
  for(let line=0;line<4;line++){
   let ids=[];
   for(let j=0;j<4;j++){
    let r=dir==='UP'?j:dir==='DOWN'?3-j:line;
    let c=dir==='LEFT'?j:dir==='RIGHT'?3-j:line;
    ids.push(r*4+c);
   }
   let vals=ids.map(i=>grid[i]).filter(Boolean);
   for(let j=0;j<vals.length-1;j++){
    if(vals[j]===vals[j+1]){
     vals[j]*=2;vals.splice(j+1,1);
    }
   }
   while(vals.length<4)vals.push(0);
   ids.forEach((id,j)=>grid[id]=vals[j]);
  }
  if(grid.every((v,i)=>v===old[i])){
   s.querySelector('#status').textContent='No move available in that direction.';
   return;
  }
  if(grid.includes(2048)){
   draw();s.querySelector('#status').textContent='You reached 2048!';return;
  }
  add();draw();
 }
 add();add();draw();
 btn(s,'RESTART',()=>game2048(s));
}

function lightsOut(s){
 let board=Array.from({length:25},()=>Math.random()<.5);
 s.innerHTML='<h3>Lights Out</h3><p>Turn all lights off. Tap a tile to switch it and its neighbours.</p><div id="lights" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:300px;margin:15px auto"></div><p id="status">Lights remaining: 0</p>';
 let area=s.querySelector('#lights');
 function draw(){
  area.innerHTML='';
  board.forEach((on,i)=>{
   let b=document.createElement('button');
   b.style.cssText='height:48px;margin:0;padding:0;background:'+(on?'#e6b85c':'#263945')+';border:1px solid #53636d';
   b.textContent=on?'●':'';
   b.onclick=()=>{
    let r=Math.floor(i/5),c=i%5;
    [[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([y,x])=>{
     if(y>=0&&y<5&&x>=0&&x<5)board[y*5+x]=!board[y*5+x];
    });
    draw();
   };
   area.appendChild(b);
  });
  let count=board.filter(Boolean).length;
  s.querySelector('#status').textContent='Lights remaining: '+count;
  if(count===0)s.querySelector('#status').textContent='You solved the puzzle!';
 }
 draw();
 btn(s,'NEW PUZZLE',()=>lightsOut(s));
}

function typingSprint(s){
 const words=['GAMING','ARCADE','PUZZLE','COMPUTER','PLAYER','SCORE','CHALLENGE','VICTORY','KEYBOARD','SCREEN'];
 let word='',score=0,time=20;
 s.innerHTML='<h3>Typing Sprint</h3><div class="big" id="word"></div><input id="typed" placeholder="Type the word"><p id="time">Time: 20</p><p id="score">Score: 0</p>';
 function next(){
  word=words[Math.floor(Math.random()*words.length)];
  s.querySelector('#word').textContent=word;
  s.querySelector('#typed').value='';
  s.querySelector('#typed').focus();
 }
 btn(s,'SUBMIT',()=>{
  if(time<=0)return;
  if(s.querySelector('#typed').value.trim().toUpperCase()===word)score++;
  s.querySelector('#score').textContent='Score: '+score;
  next();
 });
 next();
 currentTimer=setInterval(()=>{
  time--;
  s.querySelector('#time').textContent='Time: '+time;
  if(time<=0){
   clearInterval(currentTimer);currentTimer=null;
   msg(s,'Time up! Words typed correctly: '+score);
   btn(s,'Play Again',()=>typingSprint(s));
  }
 },1000);
}

function quickQuiz(s){
 const questions=[
  ['How many days are in a week?', '7',['5','6','7','8']],
  ['Which planet is known as the Red Planet?','Mars',['Earth','Mars','Venus','Jupiter']],
  ['What is 9 x 8?','72',['64','72','81','96']],
  ['Which animal is known as the king of the jungle?','Lion',['Tiger','Elephant','Lion','Wolf']],
  ['How many sides does a triangle have?','3',['2','3','4','5']],
  ['Which is the largest ocean?','Pacific',['Atlantic','Indian','Arctic','Pacific']]
 ];
 let index=0,score=0;
 function show(){
  if(index>=questions.length){
   msg(s,'Quiz finished! Score: '+score+'/'+questions.length);
   btn(s,'Play Again',()=>quickQuiz(s));
   return;
  }
  let q=questions[index];
  s.innerHTML='<h3>Question '+(index+1)+' of '+questions.length+'</h3><p>'+q[0]+'</p><div id="answers"></div><p id="result"></p>';
  q[2].forEach(a=>btn(s.querySelector('#answers'),a,()=>{
   if(a===q[1]){
    score++;
    s.querySelector('#result').textContent='Correct!';
   }else{
    s.querySelector('#result').textContent='Correct answer: '+q[1];
   }
   index++;
   btn(s,'NEXT',show);
  }));
 }
 show();
}
